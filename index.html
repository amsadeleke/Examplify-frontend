<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examplify | Secure Examination Portal</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <div id="root">
      <div style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #64748b; font-size: 14px;">
        Loading portal logic...
      </div>
    </div>
    <script>
      // Handle dynamic import failures (common in dev environments when server restarts)
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
          console.warn('Dynamic import failed, reloading page...');
          window.location.reload();
        }
      }, true);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
